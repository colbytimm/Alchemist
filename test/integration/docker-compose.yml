# Cosmos DB emulator for integration tests (make emulator-up / test-integration).
#
# The vnext-preview image runs on Apple Silicon and serves HTTP on 8081 by
# default; CI on linux/amd64 may substitute the stable image (HTTPS with a
# self-signed certificate — the adapter's insecure_skip_verify covers it).
services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: alchemist-cosmos-emulator
    ports:
      - "8081:8081"
