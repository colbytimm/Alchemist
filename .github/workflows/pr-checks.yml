name: PR Quality Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🛠️ Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    # - name: 📦 Install dependencies and tools
    #   run: |
    #     go mod download
    #     make install-tools
    #     make security-deps

    - name: 🔍 Debug workspace
      run: |
        pwd
        ls -la
        cat Makefile | grep quality-gate

    - name: 🧪 Run Quality Gate
      run: make quality-gate
