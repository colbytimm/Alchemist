name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  packages:
    uses: ./.github/workflows/packages.yml

  release:
    needs: [gates, packages]
    runs-on: ubuntu-latest
    outputs:
      tap-published: ${{ steps.tap.outputs.tap-published }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Opt-in, so the upstream can release before it has certificates and a
      # fork never trips it.
      - name: Require every signing secret
        if: vars.REQUIRE_SIGNED_RELEASES == 'true'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY WINDOWS_SIGN_PFX WINDOWS_SIGN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::REQUIRE_SIGNED_RELEASES is true but secret $name is not set"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v6
        with:
          # The changelog is built from the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Published binaries are built from a clean module and build cache:
          # a cache is writable by any earlier run on the default branch.
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y msitools wixl osslsigncode
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      # Also after a failed winget PR, so it can be opened by hand from these files.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: winget-manifests
          path: dist/winget/**
      # The same rule as skip_upload in .goreleaser.yml: auto skips a prerelease.
      - id: tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ] && [[ "$GITHUB_REF_NAME" != *-* ]]; then
            echo "tap-published=true" >> "$GITHUB_OUTPUT"
          fi
      # A failed tap push still leaves the cask here, to commit to the tap by hand.
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/alchemist.rb
      # goreleaser publishes the release before the cask, so a failed tap push
      # still leaves published files to attest.
      - if: always() && hashFiles('dist/checksums.txt') != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt

  # The winget-pkgs PR is already open when this runs: it reports a problem
  # before Microsoft's pipeline does, rather than preventing one.
  winget-install:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: winget-manifests
          path: winget
      - shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = (Get-ChildItem winget -Recurse -Filter *.installer.yaml).DirectoryName
          winget settings --enable LocalManifestFiles
          winget validate --manifest $manifest
          winget install --manifest $manifest --accept-source-agreements --accept-package-agreements --disable-interactivity
          # A step does not see a PATH change made during the job, so run the link itself.
          $version = & "$env:LOCALAPPDATA\Microsoft\WinGet\Links\alchemist.exe" --version
          if ($version -notmatch [regex]::Escape($env:TAG)) { throw "installed $version, tagged $env:TAG" }
          winget uninstall --id ColbyTimm.Alchemist -e --disable-interactivity

  brew-verify:
    needs: release
    if: needs.release.outputs.tap-published == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      # ubuntu-latest has Homebrew installed but not on its PATH.
      - if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - run: brew install colbytimm/tap/alchemist
      - run: alchemist --version | grep -F "Alchemist $GITHUB_REF_NAME "
      - run: brew audit --cask --strict --online colbytimm/tap/alchemist
