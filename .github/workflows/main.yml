name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  snapshot:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # goreleaser derives the snapshot version from the latest tag.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make release-snapshot
      - uses: actions/upload-artifact@v6
        with:
          name: snapshot-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
