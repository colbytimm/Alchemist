name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  packages:
    needs: gates
    uses: ./.github/workflows/packages.yml

  # Schema and field rules only: a snapshot's installer URLs name no real release.
  winget-validate:
    needs: packages
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
      - shell: pwsh
        run: |
          $manifest = (Get-ChildItem winget -Recurse -Filter *.installer.yaml).DirectoryName
          winget validate --manifest $manifest
