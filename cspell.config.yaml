version: "0.2"
language: en

# Go identifiers appear in prose (docs, skill references) as often as in .go
# files, so the Go dictionary is enabled globally rather than per languageId.
dictionaries:
  - bash
  - go
  - node
  - softwareTerms

dictionaryDefinitions: []

ignorePaths:
  - .git/**
  - "**/testdata/fuzz/**"
  - "**/testdata/golden/**"
  - go.mod
  - go.sum

words:
  # Module and dependency names
  - alecthomas
  - azcore
  - azcosmos
  - azidentity
  - bubbletea
  - charmbracelet
  - colbytimm
  - Timm
  - dbus
  - lipgloss
  - pflag
  - rhysd
  - stretchr
  - termenv
  - textinput
  - zricethezav
  # Terminal capabilities, emulators and Go tooling
  - benchtime
  - Ghostty
  - Setulc
  - Smulx
  # Cosmos DB REST and SQL vocabulary
  - colls
  - documentdb
  - enablecrosspartition
  - partitionkey
  - populatequerymetrics
  - STARTSWITH
  - ENDSWITH
  - STRINGEQUALS
  - REGEXMATCH
  - ISVALID
  - ISVALIDDETAILED
  - LTRIM
  - RTRIM
  - upserts
  - vnext
  - ctes
  # Go tooling and linters
  - benchmem
  - bodyclose
  - copylocks
  - coverpkg
  - coverprofile
  - depguard
  - errcheck
  - errname
  - errorlint
  - forbidigo
  - goarch
  - gocognit
  - gocritic
  - goimports
  - golangci
  - goreleaser
  - gosec
  - govet
  - govulncheck
  - ineffassign
  - ldflags
  - nilnil
  - nolint
  - nosec
  - godoc
  - incpatch
  - gofmt
  - securego
  - staticcheck
  - testdata
  - unconvert
  - unparam
  # Go stdlib identifiers quoted in prose (the go dictionary only covers .go)
  - Errorf
  - Failf
  - Fprintln
  - Getenv
  - goroutines
  - Itoa
  - omitzero
  - strconv
  - unmarshal
  # Project vocabulary
  - cands
  - idents
  - keymap
  - mydb
  - pageable
  - pinnable
  - pushdown
  - pkgs
  - reanchor
  - toks
  - unpinnable
  # Theme authors, sources and the color format themes are written in
  - Areeb
  - Ferreira
  - iareebahmad
  - Rayrarpa
  - Robb
  - RRGGBB
  - synthwave
  - vscodethemes
  - Wallacy
  # Concatenated-initialism examples in the naming reference
  - DBURL
  - XMLAPI
  # Prose the base dictionary lacks
  - dedup
  - equi
  - lintable
  - misparse
  - parallelizable
  - unaliased
  - undocked
  - unpair
  - unpunctuated
  - unrequested
  - unwritable
  - uppercased

ignoreWords:
  # Deliberately malformed SQL in the "bad sql" integration test.
  - SELEC
  # Truncated pane label inside an ASCII mockup.
  - custome
  # Words typed part-way in the autocomplete tests, and the fixture they name.
  - SELE
  # A mistyped theme name in the unknown-theme tests.
  - drakula
  - STARTSW
  - CUSTOMERI
  - stomer
  - cust
  - zcomp
  - zcomplete

import: []

overrides:
  # The go-style skill quotes upstream guides that use British spellings.
  - filename: .claude/skills/**
    language: en,en-GB
