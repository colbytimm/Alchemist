[about]
title = "Enchanted Grove Dark"
author = "M Tech"
source = "https://github.com/ChrisMcKee1/mtech-pro-vscode-themes"
license = "MIT"
background = "#2A3D2B"

[colors]
text = "#FFFFFF"
muted = "#a3c9bb"
accent = "#7A9A42"
selected = "#7FC76A"
success = "#56B56A"
warning = "#ebcb8b"
error = "#BF616A"
keyword = "#E88787"
operator = "#E88787"
literal = "#B8A3FF"
function = "#A3C5F0"
alias = "#FFFFFF"
parameter = "#FFB366"
string = "#7AB87A"
number = "#FFB366"
comment = "#c4d0ba"
punctuation = "#E8F5E8"
