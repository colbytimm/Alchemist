# Enchanted Grove Dark, adapted for Alchemist from the VS Code theme
# Enchanted Grove Dark in M Tech Themes 0.14.7 by M Tech. A dark theme:
# every role has one color for light and dark terminals.
#
# Read from "themes/Enchanted Grove Dark.json" in
# https://github.com/ChrisMcKee1/mtech-pro-vscode-themes at commit 997d8a1,
# and mapped to Alchemist's roles by the rule in docs/using/themes.md. muted
# is colors.disabledForeground, accent colors.tab.activeBorder, selected
# colors.list.highlightForeground. No exceptions to the rule.
