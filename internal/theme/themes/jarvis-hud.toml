# JARVIS HUD, adapted for Alchemist from the VS Code theme JARVIS HUD by
# Mohammad Areeb Ahmad. A dark theme: every role has one color for light and
# dark terminals.
#
# Read from "registry/Areeb Ahmad (iareebahmad)/JARVIS HUD (jarvis-hud)/
# JARVIS HUD.json" in https://github.com/AvinashReddy3108/CodemosModern-Themes-Registry,
# a mirror of vscodethemes.com's files, at commit adea5dc; no source
# repository was found. Mapped to Alchemist's roles by the rule in
# docs/using/themes.md. muted is colors.descriptionForeground, accent
# colors.progressBar.background, selected
# colors.list.activeSelectionForeground. No exceptions to the rule.
