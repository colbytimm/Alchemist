[about]
title = "JARVIS HUD"
author = "Mohammad Areeb Ahmad"
source = "https://github.com/AvinashReddy3108/CodemosModern-Themes-Registry"
license = "MIT"
background = "#04090e"

[colors]
text = "#c5ccd6"
muted = "#7d8794"
accent = "#00d9ff"
selected = "#00e5ff"
success = "#5ce6a6"
warning = "#ffb454"
error = "#ff4d5e"
keyword = "#00e5ff"
operator = "#9fa9b7"
literal = "#ff6ec7"
function = "#ffc94d"
alias = "#dfe4ea"
parameter = "#8ef2c4"
string = "#cfe88a"
number = "#ff8c42"
comment = "#59636e"
punctuation = "#6b7480"
