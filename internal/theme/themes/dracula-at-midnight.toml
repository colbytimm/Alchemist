# Dracula at Midnight, adapted for Alchemist from the VS Code theme
# Dracula At Midnight 3.0.0 by Wallacy Santos Ferreira, after Dracula Theme.
# A dark theme: every role has one color for light and dark terminals.
#
# Read from src/themes/DraculaAtMidnight.ts in
# https://github.com/walcew/dracula-at-midnight at commit 55202ae, and
# mapped to Alchemist's roles by the rule in docs/using/themes.md. muted is
# colors.editorLineNumber.foreground, accent colors.focusBorder, selected
# colors.list.highlightForeground. No exceptions to the rule.
