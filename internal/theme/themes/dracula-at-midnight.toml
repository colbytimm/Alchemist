[about]
title = "Dracula at Midnight"
author = "Wallacy Santos Ferreira"
source = "https://github.com/walcew/dracula-at-midnight"
license = "MIT"
background = "#1f1f1f"

[colors]
text = "#F8F8F2"
muted = "#9d9d9d"
accent = "#FF79C6"
selected = "#8BE9FD"
success = "#50FA7B"
warning = "#8BE9FD"
error = "#FF5555"
keyword = "#FF79C6"
operator = "#FF79C6"
literal = "#FFB86C"
function = "#8BE9FD"
alias = "#F8F8F2"
parameter = "#FFB86C"
string = "#F1FA8C"
number = "#FFB86C"
comment = "#9d9d9d"
punctuation = "#F8F8F2"
