# Red, adapted for Alchemist from the Red theme that ships with Visual Studio
# Code. A dark theme: every role has one color for light and dark terminals.
#
# Read from extensions/theme-red/themes/Red-color-theme.json in
# https://github.com/microsoft/vscode at commit e7bb375, and mapped to
# Alchemist's roles by the rule in docs/using/themes.md. muted is
# colors.pickerGroup.foreground, accent colors.progressBar.background,
# selected colors.list.highlightForeground. Exceptions: the token colors end
# in ff, fully opaque, so the ff is dropped rather than the key skipped. The
# theme sets no editorWarning.foreground or editorError.foreground, so
# warning and error are VS Code's dark defaults, the colors it draws them in.
