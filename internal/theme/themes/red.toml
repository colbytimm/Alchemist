[about]
title = "Red"
author = "Microsoft"
source = "https://github.com/microsoft/vscode/tree/main/extensions/theme-red"
license = "MIT"
background = "#390000"

[colors]
text = "#F8F8F8"
muted = "#cc9999"
accent = "#cc3333"
selected = "#ff4444"
success = "#41a83e"
warning = "#CCA700"
error = "#F14C4C"
keyword = "#f12727"
operator = "#f12727"
literal = "#994646"
function = "#ffb454"
alias = "#fb9a4b"
parameter = "#fb9a4b"
string = "#cd8d8d"
number = "#994646"
comment = "#e7c0c0"
punctuation = "#F8F8F8"
