[about]
title = "SynthWave '84"
author = "Robb Owen"
source = "https://github.com/robb0wen/synthwave-vscode"
license = "MIT"
background = "#262335"

[colors]
text = "#ffffff"
muted = "#848bbd"
accent = "#ff7edb"
selected = "#f97e72"
success = "#72f1b8"
warning = "#fede5d"
error = "#fe4450"
keyword = "#fede5d"
operator = "#fede5d"
literal = "#f97e72"
function = "#36f9f6"
alias = "#ff7edb"
parameter = "#ff7edb"
string = "#ff8b39"
number = "#f97e72"
comment = "#848bbd"
punctuation = "#ffffff"
