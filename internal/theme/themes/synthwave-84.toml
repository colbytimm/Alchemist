# SynthWave '84, adapted for Alchemist from the VS Code theme SynthWave '84
# 0.1.20 by Robb Owen. A dark theme: every role has one color for light and
# dark terminals.
#
# Read from themes/synthwave-color-theme.json in
# https://github.com/robb0wen/synthwave-vscode at commit ecfa2fe, and mapped
# to Alchemist's roles by the rule in docs/using/themes.md. muted is token
# comment, accent colors.textLink.activeForeground, selected
# colors.list.highlightForeground. Exceptions: the theme sets no
# editor.foreground, so text and punctuation are colors.foreground. success
# is colors.gitDecoration.untrackedResourceForeground, the added color
# without its alpha channel. warning is token keyword: the theme's
# editorWarning.foreground has an alpha channel and is the same mint as
# success, so a warning would not read as one.
