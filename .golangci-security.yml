run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  disable-all: true
  enable:
    # Security-focused linters
    - gosec
    - bodyclose
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - typecheck
    - nilerr
    - errname
    - errorlint
    - nestif
    - nilnil

    # Additional code quality linters that can catch security issues
    - revive
    - unused
    - misspell
    - gofmt
    - goimports

linters-settings:
  gosec:
    # Available severity levels: LOW, MEDIUM, HIGH
    severity: "LOW"
    # Confidence level that controls how gosec analyzes the code
    confidence: "LOW"
    # Exclude generated files
    exclude-generated: true
    # Includes rules in addition to default
    includes:
      - G101  # Look for hard-coded credentials
      - G102  # Bind to all network interfaces
      - G103  # Audit use of unsafe block
      - G104  # Audit errors not checked
      - G106  # Audit use of ssh InsecureIgnoreHostKey
      - G107  # Audit use of unverified TLS connection
      - G108  # Profiling endpoint automatically exposed
      - G109  # Potential Integer overflow
      - G110  # Potential DoS vulnerability
      - G111  # Directory traversal
      - G112  # CSRF in http handler
      - G113  # Potential HTTP request made with variable url
      - G114  # Use of net/http server with unspecified address
      - G201  # SQL query construction using string concatenation
      - G202  # SQL query construction using format string
      - G203  # Use of unescaped variables in HTML templates
      - G204  # Audit use of command execution
      - G301  # Poor file permissions used when creating file
      - G302  # Poor file permissions used for chmod
      - G303  # Creating tempfile using predictable path
      - G304  # File path provided as variable without proper sanitization
      - G305  # File path traversal when using Extract functions
      - G306  # Poor file permissions used when writing to file
      - G307  # Poor file permissions used when creating a directory
      - G401  # Crypto weak usage: MD5
      - G402  # Crypto TLS insecure configuration
      - G403  # Crypto weak usage: weak random number generator
      - G404  # Crypto weak usage: use of weak random number generator
      - G501  # Crypto: import blacklisted crypto libraries
      - G502  # Crypto: import blacklisted crypto libraries
      - G503  # Crypto: import blacklisted crypto libraries
      - G504  # Crypto: import blacklisted crypto libraries
      - G505  # Crypto: import blacklisted crypto libraries
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  nilerr:
    # By default, nilerr will reject code like:
    # if err != nil {
    #   return nil
    # }
    # if err is explicitly handled, it can set this true
    allow-typed-nils: false

issues:
  exclude-rules:
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - govet
        - revive
        - unused

  # Maximum issues count per one linter. Set to 0 to disable.
  max-issues-per-linter: 0
  # Maximum count of issues with the same text. Set to 0 to disable.
  max-same-issues: 0

# Output configuration options
output:
  # colored-line-number|line-number|json|tab|checkstyle|code-climate
  formats:
    - format: colored-line-number
  # print lines of code with issue
  print-issued-lines: true
  # print linter name in the end of issue text
  print-linter-name: true
