version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errname
    - errorlint
    - gocognit
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilnil
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        tui-adapter-isolation:
          files:
            - "**/internal/tui/**"
          deny:
            - pkg: github.com/colbytimm/alchemist/internal/adapter/cosmos
              desc: internal/tui must depend only on the adapter interfaces; concrete adapters are wired in cmd/
    gocognit:
      min-complexity: 30
    revive:
      rules:
        - name: var-naming
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/colbytimm/alchemist

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
